{% extends "base.html" %}
{% block title %}Delete Course | EduNova{% endblock %}
{% block content %}
<section class="confirm-page section-wrap"><div class="confirm-card"><div class="confirm-icon">!</div><span class="eyebrow">PLEASE CONFIRM</span><h1>Delete this course?</h1><p>You're about to delete <strong>{{ course.title }}</strong>. This action may not be reversible.</p><form method="post">{% csrf_token %}<button class="button button-danger" type="submit">Yes, delete course</button><a class="button button-outline" href="/">Keep course</a></form></div></section>
{% endblock %}
